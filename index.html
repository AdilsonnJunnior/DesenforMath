<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DesenforMath</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>

<body>

    <header>
        <h1>DesenforMath</h1>
    </header>

    <main class="ds-container">

        <!-- ============================= -->
        <!-- CANVAS 3D                      -->
        <!-- ============================= -->

        <section id="canvas-3d"></section>


        <!-- ============================= -->
        <!-- CANVAS 2D                      -->
        <!-- ============================= -->

        <section id="canvas-2d"></section>


        <!-- ============================= -->
        <!-- CONTROLES                      -->
        <!-- ============================= -->

        <section class="ds-col-controles">

            <select id="forma-selector">

                <option value="cubo">Cubo</option>

                <option value="paralelepipedo">
                    Paralelepípedo
                </option>

                <option value="cilindro">
                    Cilindro
                </option>

                <option value="cone">
                    Cone
                </option>

                <option value="esfera">
                    Esfera
                </option>

                <option value="prisma">
                    Prisma
                </option>

                <option value="piramide">
                    Pirâmide
                </option>

            </select>
            


            <!-- ========================= -->
            <!-- INPUTS DINÂMICOS            -->
            <!-- ========================= -->

            <div id="inputs-dinamicos">

                <!-- Os inputs serão criados pelo JavaScript -->

            </div>

        </section>


        <!-- ============================= -->
        <!-- CÁLCULO DE VOLUME              -->
        <!-- ============================= -->

        <section id="calculo-volume"></section>


        <!-- ============================= -->
        <!-- CÁLCULO DE ÁREA                -->
        <!-- ============================= -->

        <section id="calculo-area"></section>

    </main>


    <!-- ============================= -->
    <!-- CLASSES GEOMÉTRICAS            -->
    <!-- ============================= -->

    <script src="cubo.js"></script>
    <script src="paralelepipedo.js"></script>
    <script src="cilindro.js"></script>
    <script src="cone.js"></script>
    <script src="esfera.js"></script>
    <script src="prisma.js"></script>
    <script src="piramide.js"></script>


    <!-- ============================= -->
    <!-- RENDERIZADORES                  -->
    <!-- ============================= -->

    <script src="renderizador3d.js"></script>
    <script src="planificador2d.js"></script>


    <!-- ============================= -->
    <!-- CONTROLADOR                     -->
    <!-- ============================= -->

    <script src="sketch.js"></script>

</body>
</html>
